<text x="944" y="300.0" font-size="13" font-weight="700" fill="#111827" text-anchor="start" >field differs</text>
<text x="864" y="267.5" font-size="13" font-weight="700" fill="#111827" text-anchor="end" >object differs</text>
<line x1="30" y1="500" x2="1120" y2="500" stroke="#1e3a8a" stroke-width="3" stroke-dasharray="14 8"/>
