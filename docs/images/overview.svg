<text x="529" y="366.5" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start" >expanded to</text>
<text x="529" y="382.5" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start" >hourly series</text>
<text x="529" y="398.5" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start" >(8,760 h)</text>
