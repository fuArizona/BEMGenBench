<text x="315" y="469.5" font-size="40" font-weight="700" fill="#dc2626" text-anchor="middle" >?</text>
<path d="M874,171.5 q9,0 9,10 v11.0 q0,10 8,10 q-8,0 -8,10 v11.0 q0,10 -9,10" fill="none" stroke="#dc2626" stroke-width="2"/>
